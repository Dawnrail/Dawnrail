<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Dawnrail mark: a single path forks into two — the shape of a rail
       switch, and the shape of the company (one foundation, two
       products). The node at the fork doubles as a signal light: the
       "dawn" catching at the point where the line divides. -->
  <path d="M14,50 L44,50" fill="none" stroke="#D9DADD" stroke-width="6" stroke-linecap="round"/>
  <path d="M44,50 L88,20" fill="none" stroke="#D9DADD" stroke-width="6" stroke-linecap="round"/>
  <path d="M44,50 L88,80" fill="none" stroke="#D9DADD" stroke-width="6" stroke-linecap="round"/>
  <circle cx="44" cy="50" r="8" fill="#0A0A0B" stroke="#D9DADD" stroke-width="6"/>
  <circle cx="44" cy="50" r="3" fill="#D9DADD"/>
</svg>
