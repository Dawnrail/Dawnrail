<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xpecter - a terminal, reimagined</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0a0912;
    --bg-2:#050409;
    --glass:rgba(255,255,255,0.055);
    --glass-strong:rgba(255,255,255,0.09);
    --glass-border:rgba(255,255,255,0.14);
    --text:#e9e6f5;
    --text-dim:#9089ab;
    --text-faint:#5b5473;
    --accent:#b9a6ff;
    --accent-dim:#7c6bb0;
    --accent-glow:rgba(185,166,255,0.35);
    --mono:'JetBrains Mono', monospace;
    --sans:'Space Grotesk', sans-serif;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0; padding:0;}
  body{
    background:
      radial-gradient(ellipse 60% 40% at 50% 0%, var(--accent-glow) 0%, transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 100%, rgba(90,70,150,0.15) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-1), var(--bg-2));
    color:var(--text);
    font-family:var(--sans);
    min-height:100vh;
    transition:background 0.6s ease;
  }
  a{color:inherit;}
  ::selection{background:var(--accent); color:#0a0912;}

  /* ---------------- nav ---------------- */
  .topbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    max-width:960px;
    margin:0 auto;
    padding:28px 24px 0;
    font-family:var(--mono);
    font-size:13px;
    letter-spacing:0.5px;
    color:var(--text-dim);
  }
  .topbar .mark{
    display:flex;
    align-items:center;
    gap:8px;
    color:var(--text);
    font-weight:500;
  }
  .mark .dot{
    width:8px; height:8px; border-radius:50%;
    background:var(--accent);
    box-shadow:0 0 8px 2px var(--accent-glow);
  }
  .topbar nav{display:flex; gap:22px;}
  .topbar nav a{text-decoration:none; opacity:0.8;}
  .topbar nav a:hover{opacity:1; color:var(--accent);}

  /* ---------------- hero ---------------- */
  .hero{
    max-width:960px;
    margin:0 auto;
    padding:52px 24px 36px;
    text-align:center;
  }
  .hero h1{
    font-family:var(--mono);
    font-weight:700;
    font-size:clamp(28px, 5vw, 46px);
    line-height:1.25;
    margin:0 0 14px;
    letter-spacing:-0.5px;
  }
  .hero h1 .glow{color:var(--accent); text-shadow:0 0 24px var(--accent-glow);}
  .hero p.sub{
    font-size:17px;
    color:var(--text-dim);
    max-width:520px;
    margin:0 auto 40px;
    line-height:1.5;
  }

  /* ---------------- terminal ---------------- */
  .term-wrap{
    max-width:720px;
    margin:0 auto;
    padding:0 20px 60px;
  }
  .term-caption{
    text-align:center;
    font-size:15px;
    color:var(--text-dim);
    margin:0 0 22px;
  }
  .term{
    background:var(--glass);
    border:1px solid var(--glass-border);
    border-radius:var(--radius);
    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);
    box-shadow:0 40px 80px -30px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.06);
    overflow:hidden;
    text-align:left;
  }
  .term-bar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:12px 14px;
    background:var(--glass-strong);
    border-bottom:1px solid var(--glass-border);
  }
  .term-dot{width:10px; height:10px; border-radius:50%; opacity:0.7;}
  .term-dot.r{background:#ff6159;}
  .term-dot.y{background:#ffbd2e;}
  .term-dot.g{background:#28c840;}
  .term-title{
    flex:1;
    text-align:center;
    font-family:var(--mono);
    font-size:12px;
    color:var(--text-faint);
    letter-spacing:0.5px;
    margin-right:44px;
  }
  .term-body{
    padding:18px 18px 14px;
    font-family:var(--mono);
    font-size:14.5px;
    line-height:1.65;
    height:340px;
    overflow-y:auto;
    cursor:text;
  }
  .term-body::-webkit-scrollbar{width:8px;}
  .term-body::-webkit-scrollbar-thumb{background:var(--glass-border); border-radius:4px;}

  .line{white-space:pre-wrap; word-break:break-word;}
  .line.out{color:var(--text-dim);}
  .line.err{color:#ff8b8b;}
  .line.ghost{color:var(--accent);}
  .line.cmdline{color:var(--text);}
  .prompt-sym{color:var(--accent); margin-right:8px;}
  .prompt-user{color:var(--text-faint);}

  .input-row{display:flex; align-items:center;}
  .input-row .prompt-sym{flex:none;}
  #termInput{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--text);
    font-family:var(--mono);
    font-size:14.5px;
    caret-color:var(--accent);
  }

  .hint-row{
    padding:9px 18px 14px;
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--text-faint);
    border-top:1px solid var(--glass-border);
  }
  .hint-row b{color:var(--text-dim); font-weight:500;}

  @keyframes pulseGlow{
    0%,100%{opacity:0.35;}
    50%{opacity:0.6;}
  }
  @media (prefers-reduced-motion:no-preference){
    .mark .dot{animation:pulseGlow 2.4s ease-in-out infinite;}
  }

  /* ---------------- install ---------------- */
  .section{
    max-width:720px;
    margin:0 auto;
    padding:60px 24px;
  }
  .section-label{
    font-family:var(--mono);
    font-size:12px;
    color:var(--accent-dim);
    letter-spacing:2px;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .section h2{
    font-family:var(--mono);
    font-size:24px;
    margin:0 0 26px;
  }

  .os-tabs{
    display:flex;
    flex-wrap:wrap;
    gap:6px;
    margin-bottom:14px;
  }
  .os-tab{
    font-family:var(--mono);
    font-size:12.5px;
    padding:7px 14px;
    border-radius:6px;
    border:1px solid var(--glass-border);
    background:transparent;
    color:var(--text-dim);
    cursor:pointer;
    text-decoration:none;
  }
  .os-tab:hover, .os-tab:focus-visible{
    background:var(--glass-strong);
    color:var(--accent);
    border-color:var(--accent-dim);
  }
  .install-note{
    font-family:var(--mono);
    font-size:11.5px;
    color:var(--text-faint);
    margin:0;
  }

  footer{
    text-align:center;
    padding:40px 16px 70px;
    font-family:var(--mono);
    font-size:12.5px;
    color:var(--text-faint);
  }
</style>
</head>
<body id="body">

  <div class="topbar">
    <div class="mark"><span class="dot"></span>Xpecter</div>
    <nav>
      <a href="#install">install</a>
    </nav>
  </div>

  <div class="hero">
    <h1>Xpecter, a cross-platform<br>terminal emulator.</h1>
  </div>

  <div class="term-wrap">
    <p class="term-caption">Type below. It's a real one.</p>
    <div class="term">
      <div class="term-bar">
        <span class="term-dot r"></span>
        <span class="term-dot y"></span>
        <span class="term-dot g"></span>
        <span class="term-title">Xpecter - zsh</span>
      </div>
      <div class="term-body" id="termBody">
        <div class="input-row" id="inputRow" style="display:none;">
          <span class="prompt-sym">&gt;</span>
          <input id="termInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Terminal input, type help">
        </div>
      </div>
      <div class="hint-row">try <b>help</b>, <b>theme cyan</b>, <b>features</b>, or <b>install</b></div>
    </div>
  </div>

  <section class="section" id="install">
    <div class="section-label">// getting started</div>
    <h2>Install Xpecter</h2>
    <div class="os-tabs">
      <a class="os-tab" href="https://github.com/Dawnrail/Dawnrail/releases/latest/download/specter-macos-universal.zip">macOS</a>
      <a class="os-tab" href="https://github.com/Dawnrail/Dawnrail/releases/latest/download/specter-linux-amd64.tar.gz">Linux</a>
      <a class="os-tab" href="https://github.com/Dawnrail/Dawnrail/releases/latest/download/specter-windows-installer.exe">Windows</a>
    </div>
    <p class="install-note">.zip, .tar.gz, and .exe from the latest release</p>
  </section>

  <footer>Xpecter v3.0</footer>

<script>
(function(){
  const body = document.getElementById('body');
  const termBody = document.getElementById('termBody');
  const inputRow = document.getElementById('inputRow');
  const input = document.getElementById('termInput');

  const themes = {
    violet: {accent:'#b9a6ff', dim:'#7c6bb0', glow:'rgba(185,166,255,0.35)'},
    cyan:   {accent:'#6be0ff', dim:'#3f9db8', glow:'rgba(107,224,255,0.30)'},
    amber:  {accent:'#ffb35c', dim:'#b8853f', glow:'rgba(255,179,92,0.28)'},
    matrix: {accent:'#7dffa0', dim:'#4fb873', glow:'rgba(125,255,160,0.28)'}
  };

  function setTheme(name){
    const t = themes[name];
    if(!t) return false;
    document.documentElement.style.setProperty('--accent', t.accent);
    document.documentElement.style.setProperty('--accent-dim', t.dim);
    document.documentElement.style.setProperty('--accent-glow', t.glow);
    return true;
  }

  function addLine(text, cls){
    const div = document.createElement('div');
    div.className = 'line ' + (cls || 'out');
    div.textContent = text;
    termBody.insertBefore(div, inputRow);
  }

  function addRaw(html, cls){
    const div = document.createElement('div');
    div.className = 'line ' + (cls || 'out');
    div.innerHTML = html;
    termBody.insertBefore(div, inputRow);
  }

  function scrollToBottom(){
    termBody.scrollTop = termBody.scrollHeight;
  }

  // downloads, same targets as the buttons in the install section
  const releaseBase = 'https://github.com/Dawnrail/Dawnrail/releases/latest/download/';
  const builds = {
    windows: {file:'specter-windows-installer.exe', label:'windows'},
    macos:   {file:'specter-macos-universal.zip',   label:'macOS'},
    linux:   {file:'specter-linux-amd64.tar.gz',    label:'linux'}
  };
  const buildAliases = {
    windows:'windows', win:'windows', win32:'windows', exe:'windows',
    macos:'macos', mac:'macos', osx:'macos', darwin:'macos',
    linux:'linux', gnu:'linux'
  };

  function startDownload(key){
    const build = builds[key];
    if(!build) return false;
    addLine('fetching ' + build.file + ' ...', 'ghost');
    const a = document.createElement('a');
    a.href = releaseBase + build.file;
    a.rel = 'noopener';
    document.body.appendChild(a);
    a.click();
    a.remove();
    return true;
  }

  const commands = {
    help(){
      addLine('available commands:');
      addLine('  help              show this list');
      addLine('  about             what Xpecter is');
      addLine('  features          list feature flags');
      addLine('  theme <name>      violet, cyan, amber, matrix');
      addLine('  install           show the install command');
      addLine('  clear             clear the screen');
    },
    about(){
      addLine('Xpecter is a cross-platform terminal emulator.');
      addLine('a cross-platform terminal emulator. built to stay out of your way.');
    },
    features(){
      addLine('--fast              built for speed');
      addLine('--cross-platform    macOS, Linux, Windows');
      addLine('--themeable         try: theme cyan');
      addLine('--scriptable        config as code');
      addLine('--tabs-and-splits   multiplexing, built in');
    },
    install(){
      addLine('macOS    specter-macos-universal.zip');
      addLine('linux    specter-linux-amd64.tar.gz');
      addLine('windows  specter-windows-installer.exe');
      addLine('type macos, linux, or windows to download that build.', 'ghost');
    },
    whoami(){
      addLine('a curious developer, probably.');
    },
    ls(){
      addLine('features.md   themes/   install.sh   changelog.md');
    },
    clear(){
      Array.from(termBody.querySelectorAll('.line')).forEach(el => el.remove());
    },
    exit(){
      addLine("there's no exiting a browser tab. try closing it.", 'ghost');
    }
  };

  function runCommand(raw){
    const trimmed = raw.trim();
    if(!trimmed) return;
    addLine('> ' + trimmed, 'cmdline');

    const parts = trimmed.split(/\s+/);
    const cmd = parts[0].toLowerCase();

    if(cmd === 'theme'){
      const name = (parts[1] || '').toLowerCase();
      if(setTheme(name)){
        addLine('theme set to ' + name + '.', 'ghost');
      } else {
        addLine('unknown theme "' + (parts[1] || '') + '". try: violet, cyan, amber, matrix', 'err');
      }
      return;
    }

    if(cmd === 'install' || cmd === 'download' || cmd === 'get'){
      const arg = (parts[1] || '').toLowerCase();
      if(!arg){
        commands.install();
      } else if(buildAliases[arg]){
        startDownload(buildAliases[arg]);
      } else {
        addLine('no build called "' + parts[1] + '". try: windows, macos, linux', 'err');
      }
      return;
    }

    if(buildAliases[cmd]){
      startDownload(buildAliases[cmd]);
      return;
    }

    if(cmd === 'sudo'){
      addLine('nice try. Xpecter does not need sudo.', 'err');
      return;
    }

    if(commands[cmd]){
      commands[cmd]();
    } else {
      addLine('command not found: ' + cmd + ' (try "help")', 'err');
    }
  }

  input.addEventListener('keydown', (e) => {
    if(e.key === 'Enter'){
      const val = input.value;
      input.value = '';
      runCommand(val);
      requestAnimationFrame(scrollToBottom);
    }
  });

  termBody.addEventListener('click', () => input.focus());

  // boot sequence
  const boot = [
    ['Xpecter v3.0', 'ghost'],
    ["type help to begin", 'out']
  ];

  let i = 0;
  function bootStep(){
    if(i < boot.length){
      addLine(boot[i][0], boot[i][1]);
      i++;
      setTimeout(bootStep, 90);
    } else {
      inputRow.style.display = 'flex';
      input.focus();
      scrollToBottom();
    }
  }
  bootStep();

})();
</script>

</body>
</html>
